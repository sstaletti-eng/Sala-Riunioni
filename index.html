<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sala Riunioni · Spedimar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3d91'/%3E%3Crect x='7' y='9' width='18' height='16' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3Cpath d='M7 14h18M12 6v5M20 6v5' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.28.0/lib/msal-browser.min.js"
        integrity="sha384-EROj+zKZWlcPA7qutF5FClOj8vo8Cku9CiX2S+t4t4KNvKqyHEP9YN5S9sRqo/zw"
        crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f3f5f9;
    --surface: #ffffff;
    --ink: #142035;
    --muted: #5d6779;
    --faint: #8a93a3;
    --line: #e2e6ed;
    --line-strong: #cfd5df;
    --brand: #0b3d91;
    --brand-ink: #ffffff;
    --brand-soft: #e7eefb;

    --free: #eef8f2;
    --free-hover: #cdeedb;
    --free-ink: #17703f;

    --busy-bg: #fdeaea;
    --busy-bar: #d23f3f;
    --busy-ink: #7d1b1b;

    --mine-bg: #e5edfc;
    --mine-bar: #1f5fd1;
    --mine-ink: #102f6b;

    --pend-bg: #fff5dc;
    --pend-bar: #d99a00;
    --pend-ink: #6b4a00;

    --past: #f6f7f9;
    --row: 30px;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,32,53,.06), 0 4px 16px rgba(20,32,53,.06);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; background: var(--brand); color: var(--brand-ink);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 9px; background: rgba(255,255,255,.14);
    display: grid; place-items: center; flex: none;
  }
  .brand-title { font-weight: 650; font-size: 18px; letter-spacing: .2px; white-space: nowrap; }
  .brand-sub { font-size: 12px; opacity: .78; white-space: nowrap; }
  .user { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; background: #fff; color: var(--brand);
    display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none;
  }
  .user-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .btn-ghost-light {
    background: transparent; border: 1px solid rgba(255,255,255,.35); color: #fff;
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  .btn-ghost-light:hover { background: rgba(255,255,255,.12); }

  .banner {
    margin: 12px 20px 0; padding: 10px 14px; border-radius: 8px; font-size: 14px;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .banner.demo { background: #fff5dc; color: #5c4100; border: 1px solid #f1d58a; }
  .banner.error { background: #fdeaea; color: #7d1b1b; border: 1px solid #f2b8b8; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    padding: 14px 20px 10px;
  }
  .weeknav { display: flex; align-items: center; gap: 8px; }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--surface); display: grid; place-items: center;
  }
  .iconbtn:hover { background: var(--brand-soft); border-color: #b9c9ea; }
  .btn-today {
    height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--surface); font-weight: 600; font-size: 14px;
  }
  .btn-today:hover { background: var(--brand-soft); }
  .weeklabel { font-size: 18px; font-weight: 650; margin-left: 6px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .sw.free { background: var(--free); border: 1px solid #b7e3c8; }
  .sw.busy { background: var(--busy-bg); border-left: 4px solid var(--busy-bar); }
  .sw.mine { background: var(--mine-bg); border-left: 4px solid var(--mine-bar); }

  /* ---------- day tabs (mobile) ---------- */
  .daytabs { display: none; gap: 6px; padding: 0 16px 10px; }
  .daytab {
    flex: 1; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 8px;
    padding: 6px 0; font-size: 13px; line-height: 1.15;
  }
  .daytab b { display: block; font-size: 16px; }
  .daytab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
  .daytab.today:not(.active) { border-color: var(--brand); color: var(--brand); }

  /* ---------- calendar grid ---------- */
  .calwrap { padding: 0 20px 16px; }
  .cal {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; border: 1px solid var(--line);
  }
  .grid { display: grid; grid-template-columns: 60px repeat(5, minmax(0, 1fr)); }
  .corner { border-bottom: 1px solid var(--line); background: var(--surface); }
  .dayhead {
    padding: 10px 8px; text-align: center; border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line); background: var(--surface);
  }
  .dayhead .dn { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  .dayhead .dd { font-size: 20px; font-weight: 650; margin-top: 2px; }
  .dayhead.today .dd {
    display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
    background: var(--brand); color: #fff; font-size: 17px;
  }
  .dayhead.today .dn { color: var(--brand); font-weight: 700; }

  .timecol { position: relative; }
  .tlabel {
    height: var(--row); font-size: 12px; color: var(--faint); text-align: right; padding-right: 8px;
    transform: translateY(-7px);
  }
  .tlabel.half { visibility: hidden; }
  .daycol { position: relative; border-left: 1px solid var(--line); }
  .slot {
    height: var(--row); border-top: 1px solid transparent; background: var(--free);
    position: relative; display: block; width: 100%; border-left: 0; border-right: 0; border-bottom: 0;
    padding: 0; text-align: left;
  }
  .slot.hour { border-top-color: var(--line); }
  .slot.halfline { border-top: 1px dashed #e8ebf0; }
  button.slot:hover { background: var(--free-hover); }
  button.slot:hover::after {
    content: "+ Prenota"; position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    font-size: 12px; font-weight: 600; color: var(--free-ink);
  }
  .slot.past { background: var(--past); cursor: default; }
  .slot.wait { background: #f1f3f6; cursor: progress; }

  .ev {
    position: absolute; left: 3px; right: 3px; border-radius: 6px; padding: 3px 7px;
    overflow: hidden; font-size: 12.5px; line-height: 1.25; text-align: left;
    border: 0; border-left: 4px solid var(--busy-bar); background: var(--busy-bg); color: var(--busy-ink);
    box-shadow: 0 1px 2px rgba(20,32,53,.08); z-index: 2;
  }
  .ev:hover { filter: brightness(.97); box-shadow: 0 2px 8px rgba(20,32,53,.16); }
  .ev.mine { border-left-color: var(--mine-bar); background: var(--mine-bg); color: var(--mine-ink); }
  .ev.pending {
    border-left-color: var(--pend-bar); color: var(--pend-ink); cursor: progress;
    background: repeating-linear-gradient(-45deg, var(--pend-bg), var(--pend-bg) 8px, #ffefc2 8px, #ffefc2 16px);
  }
  .ev.past { opacity: .62; }
  .ev .t { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .ev .m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; opacity: .85; }
  .ev.short { display: flex; gap: 6px; align-items: center; padding-top: 1px; padding-bottom: 1px; }
  .ev.short .t { flex: 0 1 auto; }
  .ev.short .m { flex: 1 1 auto; }
  .badge {
    display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px;
    background: var(--mine-bar); color: #fff; margin-right: 4px; vertical-align: 1px;
  }
  .nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--brand); z-index: 3; pointer-events: none; }
  .nowline::before {
    content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%;
    background: var(--brand);
  }

  .footer {
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    padding: 0 20px 24px; font-size: 12.5px; color: var(--faint);
  }
  .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fa866; margin-right: 6px; vertical-align: 1px; }
  .sync-dot.loading { background: var(--pend-bar); }
  .sync-dot.err { background: var(--busy-bar); }

  /* ---------- modal ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(15,24,40,.45); display: grid; place-items: center;
    padding: 16px; z-index: 50; animation: fade .12s ease-out;
  }
  .modal {
    width: 100%; max-width: 460px; background: var(--surface); border-radius: 14px;
    box-shadow: 0 20px 60px rgba(10,20,40,.3); overflow: hidden; animation: pop .14s ease-out;
    max-height: calc(100vh - 32px); overflow-y: auto;
  }
  .modal-head { padding: 18px 20px 6px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .modal-head h2 { margin: 0; font-size: 19px; }
  .modal-head .sub { color: var(--muted); font-size: 14px; margin-top: 3px; }
  .xbtn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; font-size: 20px; color: var(--muted); flex: none; }
  .xbtn:hover { background: var(--bg); }
  .modal-body { padding: 10px 20px 4px; }
  .modal-foot { padding: 14px 20px 18px; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .field input[type=text], .field input[type=date], .field select {
    width: 100%; height: 42px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 12px;
    font: inherit; background: #fff; color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .readonly { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--bg); font-size: 15px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .durs { display: flex; flex-wrap: wrap; gap: 6px; }
  .dur {
    border: 1px solid var(--line-strong); background: #fff; border-radius: 8px; padding: 8px 12px;
    font-size: 14px; font-weight: 600; min-width: 62px;
  }
  .dur:hover:not(:disabled) { border-color: var(--brand); }
  .dur.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .dur:disabled { opacity: .38; text-decoration: line-through; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .hint.warn { color: var(--busy-ink); }
  .btn {
    height: 42px; padding: 0 18px; border-radius: 9px; border: 1px solid var(--line-strong); background: #fff;
    font-weight: 600; font-size: 15px;
  }
  .btn:hover:not(:disabled) { background: var(--bg); }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #093479; }
  .btn.danger { background: #fff; border-color: #e7a3a3; color: #a32121; }
  .btn.danger:hover:not(:disabled) { background: #fdeaea; }
  .btn:disabled { opacity: .5; }
  .detail-list { margin: 4px 0 0; padding: 0; list-style: none; }
  .detail-list li { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .detail-list li:last-child { border-bottom: 0; }
  .detail-list .k { width: 92px; flex: none; color: var(--muted); font-size: 13px; padding-top: 1px; }
  .note { background: var(--bg); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; color: var(--muted); margin: 12px 0 4px; }
  .note a { color: var(--brand); }

  /* ---------- login ---------- */
  .login {
    min-height: 100vh; display: grid; place-items: center; padding: 20px;
    background: linear-gradient(160deg, #0b3d91 0%, #0a2f6e 55%, #081f49 100%);
  }
  .login-card {
    background: #fff; border-radius: 16px; padding: 36px 32px 30px; width: 100%; max-width: 380px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.3);
  }
  .login-card .lm { width: 56px; height: 56px; border-radius: 14px; background: var(--brand); display: grid; place-items: center; margin: 0 auto 16px; }
  .login-card h1 { font-size: 22px; margin: 0 0 6px; }
  .login-card p { color: var(--muted); margin: 0 0 24px; font-size: 14.5px; }
  .msbtn {
    width: 100%; height: 46px; border-radius: 9px; border: 1px solid var(--line-strong); background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; font-size: 15px;
  }
  .msbtn:hover { background: var(--bg); }
  .login-card .small { font-size: 12.5px; color: var(--faint); margin-top: 18px; }

  .loading-screen { min-height: 60vh; display: grid; place-items: center; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--brand); animation: spin .8s linear infinite; margin: 0 auto 12px; }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: calc(100vw - 32px); }
  .toast {
    min-width: 260px; max-width: 380px; padding: 12px 14px; border-radius: 10px; color: #fff; font-size: 14px;
    box-shadow: 0 8px 24px rgba(10,20,40,.25); animation: slidein .18s ease-out; display: flex; gap: 10px; align-items: flex-start;
  }
  .toast.ok { background: #1d8a4e; }
  .toast.err { background: #c03434; }
  .toast.info { background: #26324a; }
  .toast b { display: block; }

  @keyframes fade { from { opacity: 0 } }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0 } }
  @keyframes slidein { from { transform: translateX(16px); opacity: 0 } }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ---------- mobile: one day at a time ---------- */
  @media (max-width: 760px) {
    .topbar { padding: 10px 16px; }
    .brand-sub, .user-name { display: none; }
    .toolbar { padding: 12px 16px 8px; }
    .weeklabel { font-size: 16px; }
    .legend { display: none; }
    .daytabs { display: flex; }
    .calwrap { padding: 0 12px 12px; }
    .banner { margin: 10px 12px 0; }
    .footer { padding: 0 12px 20px; }
    .grid { grid-template-columns: 52px minmax(0, 1fr); }
    .grid .dayhead, .grid .daycol { display: none; }
    .grid.show-0 [data-d="0"], .grid.show-1 [data-d="1"], .grid.show-2 [data-d="2"],
    .grid.show-3 [data-d="3"], .grid.show-4 [data-d="4"] { display: block; }
    .grid .dayhead { border-left: 0; }
    .ev { font-size: 13.5px; }
    button.slot:hover::after { content: none; }
    #toasts { left: 16px; right: 16px; }
    .toast { max-width: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="loading-screen"><div><div class="spinner"></div>Caricamento…</div></div></div>
<div id="modal"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   CONFIGURAZIONE — compilare dopo la registrazione dell'app in Entra ID
   ===================================================================== */
const CONFIG = {
  tenantId:  "7693012d-bd02-4e23-9d68-d2f32763ee7d",          // Entra ID > Panoramica > ID tenant (directory)
  clientId:  "4027aee9-3314-4e0f-9229-fc4375dd715e",          // Registrazioni app > Sala Riunioni > ID applicazione (client)
  roomEmail: "sala.riunioni@spedimar.ch",   // indirizzo stampato a fine script PowerShell
  roomName:  "Sala Riunioni",
  admins:    ["stefanostaletti@spedimar.ch"],    // possono eliminare qualsiasi prenotazione
  dayStart: 8,          // prima ora visibile
  dayEnd:   18,         // ultima ora (fine giornata)
  slotMinutes: 30,
  refreshSeconds: 30,
  maxRecurrenceDays: 180, // deve coincidere con BookingWindowDays dello script
  timeZone: "W. Europe Standard Time"
};
/* ===================================================================== */

const SCOPES = ["User.Read", "Calendars.ReadWrite", "Calendars.ReadWrite.Shared"];
const DEMO = /INSERIRE/.test(CONFIG.clientId + CONFIG.tenantId) || new URLSearchParams(location.search).has("demo");

const DAY_NAMES   = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
const DAY_SHORT   = ["Lun", "Mar", "Mer", "Gio", "Ven"];
const MONTHS      = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const DURATIONS   = [30, 60, 90, 120, 180, 240];
const ROW_PX      = 30;

/* ---------------- utilità ---------------- */
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const addMin  = (d, m) => new Date(d.getTime() + m * 60000);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const atTime  = (d, h, m = 0) => { const x = new Date(d); x.setHours(h, m, 0, 0); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const mondayOf = d => { const x = atTime(d, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const hhmm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const dateIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const localIso = d => `${dateIso(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}:00`;
const parseUtc = s => new Date(String(s).replace(/(\.\d+)?Z?$/, "") + "Z");
const longDate = d => `${DAY_NAMES[(d.getDay() + 6) % 7]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const durLabel = m => m < 60 ? `${m} min` : (m % 60 ? `${Math.floor(m / 60)} h ${m % 60}` : `${m / 60} h`);
const initials = n => (n || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join("");
const overlaps = (s1, e1, s2, e2) => s1 < e2 && s2 < e1;
const sleep = ms => new Promise(r => setTimeout(r, ms));

function weekLabel(ws) {
  const we = addDays(ws, 4);
  if (ws.getMonth() === we.getMonth()) return `${ws.getDate()}–${we.getDate()} ${MONTHS[we.getMonth()]} ${we.getFullYear()}`;
  return `${ws.getDate()} ${MONTHS[ws.getMonth()].slice(0, 3)} – ${we.getDate()} ${MONTHS[we.getMonth()].slice(0, 3)} ${we.getFullYear()}`;
}

/* =====================================================================
   API — Microsoft Graph (reale) oppure demo in memoria
   ===================================================================== */
let msalApp = null, account = null;

function redirectUri() {
  return location.origin + location.pathname.replace(/index\.html$/i, "");
}

async function getToken() {
  try {
    const r = await msalApp.acquireTokenSilent({ scopes: SCOPES, account });
    return r.accessToken;
  } catch (e) {
    if (e instanceof msal.InteractionRequiredAuthError) {
      await msalApp.acquireTokenRedirect({ scopes: SCOPES, account });
      return new Promise(() => {});
    }
    throw e;
  }
}

async function graph(path, { method = "GET", body } = {}) {
  const url = path.startsWith("http") ? path : "https://graph.microsoft.com/v1.0" + path;
  const res = await fetch(url, {
    method,
    headers: { Authorization: "Bearer " + await getToken(), "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if (res.status === 202 || res.status === 204) return null;
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error(data?.error?.message || res.statusText);
    err.status = res.status; err.code = data?.error?.code;
    throw err;
  }
  return data;
}

const roomPath = () => `/users/${encodeURIComponent(CONFIG.roomEmail)}`;

function normalize(e) {
  return {
    id: e.id,
    subject: e.subject || "(senza titolo)",
    start: parseUtc(e.start.dateTime),
    end: parseUtc(e.end.dateTime),
    allDay: !!e.isAllDay,
    organizerName: e.organizer?.emailAddress?.name || "",
    organizerEmail: (e.organizer?.emailAddress?.address || "").toLowerCase(),
    iCalUId: e.iCalUId,
    seriesMasterId: e.seriesMasterId || null,
    recurring: e.type === "occurrence" || e.type === "exception"
  };
}

const GraphApi = {
  async me() {
    const u = await graph("/me?$select=displayName,mail,userPrincipalName");
    return {
      name: u.displayName,
      emails: [u.mail, u.userPrincipalName, account?.username].filter(Boolean).map(s => s.toLowerCase())
    };
  },

  async listRoom(from, to) {
    const sel = "id,subject,start,end,organizer,isAllDay,isCancelled,iCalUId,type,seriesMasterId,showAs";
    let url = `${roomPath()}/calendarView?startDateTime=${from.toISOString()}&endDateTime=${to.toISOString()}&$select=${sel}&$top=250`;
    const out = [];
    while (url) {
      const d = await graph(url);
      out.push(...d.value);
      url = d["@odata.nextLink"];
    }
    return out.filter(e => !e.isCancelled && e.showAs !== "free").map(normalize);
  },

  async create(b) {
    const payload = {
      subject: b.subject,
      start: { dateTime: localIso(b.start), timeZone: CONFIG.timeZone },
      end:   { dateTime: localIso(b.end),   timeZone: CONFIG.timeZone },
      location: { displayName: CONFIG.roomName, locationEmailAddress: CONFIG.roomEmail, locationType: "conferenceRoom" },
      attendees: [{ emailAddress: { address: CONFIG.roomEmail, name: CONFIG.roomName }, type: "resource" }],
      showAs: "busy",
      allowNewTimeProposals: false,
      body: { contentType: "text", content: "Prenotazione effettuata dall'app Sala Riunioni Spedimar." }
    };
    if (b.recurrence) payload.recurrence = b.recurrence;
    const ev = await graph("/me/events", { method: "POST", body: payload });
    return ev.id;
  },

  // 'accepted' | 'declined' | 'pending'
  async roomResponse(myEventId) {
    const ev = await graph(`/me/events/${myEventId}?$select=attendees`);
    const room = (ev.attendees || []).find(a => (a.emailAddress?.address || "").toLowerCase() === CONFIG.roomEmail.toLowerCase());
    const r = room?.status?.response;
    if (r === "accepted") return "accepted";
    if (r === "declined") return "declined";
    return "pending";
  },

  async discard(myEventId) {
    await graph(`/me/events/${myEventId}`, { method: "DELETE" });
  },

  async cancelMine(ev, wholeSeries) {
    const from = addMin(ev.start, -1), to = addMin(ev.end, 1);
    const d = await graph(`/me/calendarView?startDateTime=${from.toISOString()}&endDateTime=${to.toISOString()}&$select=id,iCalUId,seriesMasterId,isOrganizer,start,end&$top=50`);
    const list = d.value || [];
    const mine = list.find(x => x.iCalUId === ev.iCalUId) ||
                 list.find(x => x.isOrganizer && +parseUtc(x.start.dateTime) === +ev.start && +parseUtc(x.end.dateTime) === +ev.end);
    if (!mine) throw new Error("Non trovo questa riunione nel tuo calendario. Annullala direttamente da Outlook.");
    const target = wholeSeries && mine.seriesMasterId ? mine.seriesMasterId : mine.id;
    await graph(`/me/events/${target}/cancel`, { method: "POST", body: { comment: "Prenotazione della sala annullata." } });
  },

  async adminDelete(ev, wholeSeries) {
    const target = wholeSeries && ev.seriesMasterId ? ev.seriesMasterId : ev.id;
    await graph(`${roomPath()}/events/${target}`, { method: "DELETE" });
  }
};

const DemoApi = (() => {
  const ws = mondayOf(new Date());
  let seq = 1;
  const people = [
    ["Marco Rossi", "m.rossi@spedimar.ch"], ["Laura Bianchi", "l.bianchi@spedimar.ch"],

  ];
  const mk = (day, h, m, mins, subject, p, extra = {}) => {
    const start = atTime(addDays(ws, day), h, m);
    return { id: "d" + seq++, subject, start, end: addMin(start, mins), allDay: false,
             organizerName: people[p][0], organizerEmail: people[p][1], iCalUId: "u" + seq, seriesMasterId: null, recurring: false, ...extra };
  };
  const events = [];
  // riunione ricorrente del lunedì (4 settimane)
  for (let w = -1; w < 4; w++) events.push(mk(7 * w, 9, 0, 60, "Riunione operativa settimanale", 2, { seriesMasterId: "s1", recurring: true }));
  events.push(mk(1, 10, 30, 90, "Call con cliente DHL", 0));
  events.push(mk(1, 14, 0, 60, "Colloquio candidato magazzino", 1));
  events.push(mk(2, 11, 0, 30, "Allineamento IT", 3));
  events.push(mk(3, 15, 0, 120, "Presentazione SIGEP Transport", 2));
  events.push(mk(4, 8, 30, 60, "Revisione tariffe Galliker", 0));
  events.push(mk(8, 10, 0, 60, "Visita fornitore", 1));
  const pendingResp = new Map();

  return {
    async me() { await sleep(150); return { name: "Utente Demo", emails: ["demo@spedimar.ch"] }; },
    async listRoom(from, to) { await sleep(200); return events.filter(e => overlaps(e.start, e.end, from, to)).map(e => ({ ...e })); },
    async create(b) {
      await sleep(400);
      const starts = [b.start];
      if (b.recurrence) {
        const until = atTime(new Date(b.recurrence.range.endDate + "T00:00:00"), 23, 59);
        const daily = b.recurrence.pattern.daysOfWeek.length > 1;
        for (let d = addDays(b.start, daily ? 1 : 7); d <= until; d = addDays(d, daily ? 1 : 7)) {
          if (daily && (d.getDay() === 0 || d.getDay() === 6)) continue;
          starts.push(d);
        }
      }
      const mins = (b.end - b.start) / 60000;
      const conflict = starts.some(s => events.some(e => overlaps(s, addMin(s, mins), e.start, e.end)));
      const id = "d" + seq++;
      if (conflict) { pendingResp.set(id, "declined"); return id; }
      const master = b.recurrence ? "s" + seq : null;
      starts.forEach(s => events.push({ id: "d" + seq++, subject: b.subject, start: s, end: addMin(s, mins), allDay: false,
        organizerName: "Utente Demo", organizerEmail: "demo@spedimar.ch", iCalUId: "u" + seq, seriesMasterId: master, recurring: !!master }));
      pendingResp.set(id, "accepted");
      return id;
    },
    async roomResponse(id) { await sleep(900); return pendingResp.get(id) || "pending"; },
    async discard() {},
    async cancelMine(ev, wholeSeries) { await sleep(300); this._remove(ev, wholeSeries); },
    async adminDelete(ev, wholeSeries) { await sleep(300); this._remove(ev, wholeSeries); },
    _remove(ev, wholeSeries) {
      for (let i = events.length - 1; i >= 0; i--) {
        const e = events[i];
        if (e.id === ev.id || (wholeSeries && ev.seriesMasterId && e.seriesMasterId === ev.seriesMasterId)) events.splice(i, 1);
      }
    }
  };
})();

  loading: false,

  error: null,
  lastSync: null
};

const isMine = ev => !!state.me && state.me.emails.includes(ev.organizerEmail);

function visibleEvents() {
  const now = Date.now();
  for (const [id, exp] of state.hidden) if (exp < now) state.hidden.delete(id);
  return state.events.filter(e => !state.hidden.has(e.id));
}

/* =====================================================================
   CARICAMENTO DATI
   ===================================================================== */
let refreshSeq = 0;
async function refresh() {
  const mySeq = ++refreshSeq;
  const from = state.weekStart, to = addDays(state.weekStart, 7);
  state.loading = true; renderFooter();
  try {
    const evs = await api.listRoom(from, to);
    if (mySeq !== refreshSeq) return;
    state.events = evs;
    state.loadedWeek = +from;
    state.error = null;
    state.lastSync = new Date();
  } catch (e) {
    if (mySeq !== refreshSeq) return;
    state.error = friendlyError(e);
  } finally {
    if (mySeq === refreshSeq) { state.loading = false; render(); }
  }
}

function friendlyError(e) {
  if (e.status === 403 || e.code === "ErrorAccessDenied")
    return "Non hai i permessi per vedere il calendario della sala. Contatta l'IT.";
  if (e.status === 404 || e.code === "ErrorInvalidUser" || e.code === "ResourceNotFound")
    return "Calendario della sala non trovato: verificare l'indirizzo roomEmail nella configurazione.";
  if (e.status === 401) return "Sessione scaduta. Ricarica la pagina.";
  if (e instanceof TypeError) return "Connessione non disponibile. Riprovo automaticamente.";
  return "Errore: " + (e.message || e);
}

                 <span>Puoi prenotare la sala anche da Outlook o Teams: comparirà qui.</span>`;

function renderDay(i, rows) {
  const day = addDays(state.weekStart, i);
  const dayStart = atTime(day, CONFIG.dayStart), dayEnd = atTime(day, CONFIG.dayEnd);
  const now = new Date();
  const ready = state.loadedWeek === +state.weekStart;

  let slots = "";
  for (let r = 0; r < rows; r++) {
    const s = addMin(dayStart, r * CONFIG.slotMinutes);
    const past = addMin(s, CONFIG.slotMinutes) <= now;
    const cls = ["slot", s.getMinutes() === 0 ? "hour" : "halfline", past ? "past" : ready ? "" : "wait"].join(" ");
    slots += past || !ready
      ? `<div class="${cls}"></div>`
      : `<button class="${cls}" data-action="book" data-t="${s.getTime()}" aria-label="Prenota ${longDate(s)} alle ${hhmm(s)}"></button>`;
  }

  // eventi del giorno (reali + in attesa), ritagliati sull'orario visibile
  const evs = visibleEvents().map(e => ({ ...e, kind: isMine(e) ? "mine" : "busy" }));
  for (const p of state.pending) {
    const dup = evs.some(e => +e.start === +p.start && +e.end === +p.end && isMine(e));
    if (!dup) evs.push({ ...p, kind: "pending" });
  }
  const dayEvs = evs
    .map(e => e.allDay ? { ...e, vs: dayStart, ve: dayEnd } : { ...e, vs: new Date(Math.max(e.start, dayStart)), ve: new Date(Math.min(e.end, dayEnd)) })
    .filter(e => overlaps(e.start, e.end, atTime(day, 0), atTime(addDays(day, 1), 0)) && e.vs < e.ve)
    .sort((a, b) => a.vs - b.vs || b.ve - a.ve);

  // corsie per eventuali sovrapposizioni (es. prenotazioni fatte prima delle regole)
  const lanes = [];
  dayEvs.forEach(e => {
    let lane = lanes.findIndex(end => end <= e.vs);
    if (lane === -1) { lane = lanes.length; lanes.push(e.ve); } else lanes[lane] = e.ve;
    e.lane = lane;
  });
  dayEvs.forEach(e => { e.lanes = Math.max(1, ...dayEvs.filter(o => overlaps(o.vs, o.ve, e.vs, e.ve)).map(o => o.lane + 1)); });

  const pxPerMin = ROW_PX / CONFIG.slotMinutes;
  const evHtml = dayEvs.map(e => {
    const top = (e.vs - dayStart) / 60000 * pxPerMin;
    const h = Math.max((e.ve - e.vs) / 60000 * pxPerMin - 2, 18);
    const short = h < 40;
    const widthPct = 100 / e.lanes;
    const pos = e.lanes > 1 ? `left:calc(${widthPct * e.lane}% + 3px);right:auto;width:calc(${widthPct}% - 6px);` : "";
    const time = e.allDay ? "Tutto il giorno" : `${hhmm(e.start)}–${hhmm(e.end)}`;
    const who = e.kind === "pending" ? "In attesa di conferma…" : e.kind === "mine" ? "" : e.organizerName;
    const meta = [time, who].filter(Boolean).join(" · ");
    const badge = e.kind === "mine" ? `<span class="badge">TUA</span>` : "";
    const past = e.end <= now ? "past" : "";
    const action = e.kind === "pending" ? "" : `data-action="detail" data-id="${esc(e.id)}"`;
    return `<button class="ev ${e.kind} ${short ? "short" : ""} ${past}" style="top:${top + 1}px;height:${h}px;${pos}" ${action}
              title="${esc(e.subject)} — ${esc(meta)}">
              <span class="t">${badge}${esc(e.subject)}</span><span class="m">${esc(meta)}</span></button>`;
  }).join("");

  let nowHtml = "";
  if (sameDay(day, now) && now >= dayStart && now <= dayEnd) {
    nowHtml = `<div class="nowline" style="top:${(now - dayStart) / 60000 * pxPerMin}px"></div>`;
  }
  return `<div class="daycol" data-d="${i}">${slots}${evHtml}${nowHtml}</div>`;
}

/* ---------- prenotazione ---------- */
let form = null;

function openBooking(startMs) {
  if (state.loadedWeek !== +state.weekStart) return;
  const start = new Date(startMs);
  form = { day: atTime(start, 0), start, minutes: 60, subject: "", repeat: "none", until: dateIso(addDays(start, 84)) };
  fitDuration();
  renderBooking();
}

function busyFor(s, e) {
  return visibleEvents().find(ev => overlaps(s, e, ev.start, ev.end));
}

function durationAllowed(start, mins) {
  const end = addMin(start, mins);
  if (end > atTime(start, CONFIG.dayEnd)) return false;
  return !busyFor(start, end);
}

function fitDuration() {
  if (durationAllowed(form.start, form.minutes)) return;
  const ok = DURATIONS.filter(m => durationAllowed(form.start, m));
  if (ok.length) form.minutes = ok.filter(m => m < form.minutes).pop() || ok[0];
}

function renderBooking() {
  const f = form;
  const rows = (CONFIG.dayEnd - CONFIG.dayStart) * 60 / CONFIG.slotMinutes;
  const now = new Date();
  let opts = "";
  for (let r = 0; r < rows; r++) {
    const s = addMin(atTime(f.day, CONFIG.dayStart), r * CONFIG.slotMinutes);

    opts += `<option value="${s.getTime()}" ${+s === +f.start ? "selected" : ""}>${hhmm(s)}</option>`;
  }
  const anyOk = DURATIONS.some(m => durationAllowed(f.start, m));
  const end = addMin(f.start, f.minutes);
  const durs = DURATIONS.map(m => `<button type="button" class="dur ${m === f.minutes && anyOk ? "on" : ""}" data-action="dur" data-m="${m}"
      ${durationAllowed(f.start, m) ? "" : "disabled"}>${durLabel(m)}</button>`).join("");
  const blocker = !anyOk ? busyFor(f.start, addMin(f.start, CONFIG.slotMinutes)) : null;
  const maxUntil = dateIso(addDays(new Date(), CONFIG.maxRecurrenceDays - 1));
  const wd = DAY_NAMES[(f.day.getDay() + 6) % 7].toLowerCase();

  openModal(`
    <form id="bookform" autocomplete="off">

        </div>
        <div class="row2">
          <div class="field">
            <label for="f-start">Inizio</label>
            <select id="f-start">${opts}</select>
          </div>
          <div class="field">
            <label>Fine</label>
            <div class="readonly">${anyOk ? hhmm(end) : "—"}</div>
          </div>
        </div>
        <div class="field">

          <div class="durs">${durs}</div>
          ${blocker ? `<div class="hint warn">Alle ${hhmm(f.start)} la sala è occupata (${esc(blocker.subject)}). Scegli un altro orario.</div>`
                    : `<div class="hint">Le durate barrate non sono disponibili: sala già occupata o oltre le ${CONFIG.dayEnd}:00.</div>`}
        </div>

      <div class="modal-foot">
        <button type="button" class="btn" data-action="close">Annulla</button>
        <button type="submit" class="btn primary" ${anyOk ? "" : "disabled"}>✓ Prenota</button>
      </div>
    </form>`);

  const m = document.getElementById("modal");
  m.querySelector("#f-subject").addEventListener("input", e => { form.subject = e.target.value; });
  m.querySelector("#f-start").addEventListener("change", e => { form.start = new Date(+e.target.value); fitDuration(); keepSubject(); renderBooking(); });
  m.querySelector("#f-repeat").addEventListener("change", e => { form.repeat = e.target.value; keepSubject(); renderBooking(); });
  const u = m.querySelector("#f-until");
  if (u) u.addEventListener("change", e => { form.until = e.target.value; });
  m.querySelector("#bookform").addEventListener("submit", e => { e.preventDefault(); submitBooking(); });
}

function keepSubject() {
  const el = document.getElementById("f-subject");
  if (el) form.subject = el.value;
}

async function submitBooking() {
  keepSubject();
  const f = form;
  const subject = f.subject.trim();
  if (!subject) { toast("err", "Manca il motivo", "Scrivi il motivo della riunione."); document.getElementById("f-subject")?.focus(); return; }
  const start = f.start, end = addMin(f.start, f.minutes);
  if (start < new Date(Date.now() - 60000)) { toast("err", "Orario passato", "Scegli un orario futuro."); return; }

  let recurrence = null;
  if (f.repeat !== "none") {
    const max = dateIso(addDays(new Date(), CONFIG.maxRecurrenceDays - 1));
    if (!f.until || f.until < dateIso(start)) { toast("err", "Data di fine non valida", "Controlla il campo «Fino al»."); return; }
    if (f.until > max) { toast("err", "Serie troppo lunga", `Si può prenotare al massimo fino al ${max.split("-").reverse().join(".")}.`); return; }
    const wdName = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"][start.getDay()];
    recurrence = {
      pattern: { type: "weekly", interval: 1, firstDayOfWeek: "monday",
                 daysOfWeek: f.repeat === "weekly" ? [wdName] : ["monday","tuesday","wednesday","thursday","friday"] },
      range: { type: "endDate", startDate: dateIso(start), endDate: f.until, recurrenceTimeZone: CONFIG.timeZone }
    };
  }

  // ricontrollo aggiornato prima di inviare
  const btn = document.querySelector("#bookform button[type=submit]");
  if (btn) { btn.disabled = true; btn.textContent = "Verifico…"; }
  await refresh();
  const clash = busyFor(start, end);
  if (clash) {
    toast("err", "Orario appena occupato", `${clash.subject} (${hhmm(clash.start)}–${hhmm(clash.end)}). Scegli un altro orario.`);
    renderBooking();
    return;
  }
  closeModal();

  const pend = { id: "pend-" + Date.now(), subject, start, end, allDay: false, organizerName: state.me.name, organizerEmail: state.me.emails[0] };
  state.pending.push(pend);
  render();

  const done = () => { state.pending = state.pending.filter(p => p !== pend); };
  try {
    const id = await api.create({ subject, start, end, recurrence });
    let result = "pending";
    for (let i = 0; i < 15 && result === "pending"; i++) {
      await sleep(2000);
      result = await api.roomResponse(id).catch(() => "pending");
    }
    done();
    if (result === "accepted") {
      toast("ok", "Prenotazione confermata!", `${subject} · ${longDate(start)}, ${hhmm(start)}–${hhmm(end)}. La trovi anche nel tuo calendario Outlook.`);
    } else if (result === "declined") {
      await api.discard(id).catch(() => {});
      toast("err", "La sala ha rifiutato", recurrence ? "Almeno una delle date della serie è già occupata." : "L'orario risulta già occupato.");
    } else {
      toast("info", "Prenotazione inviata", "La conferma della sala sta arrivando: la prenotazione comparirà a breve.");
    }
  } catch (e) {
    done();
    toast("err", "Prenotazione non riuscita", friendlyError(e));
  }
  refresh();
}

/* ---------- dettaglio / annullamento ---------- */
function openDetail(id) {
  const ev = visibleEvents().find(e => e.id === id);
  if (!ev) return;
  const mine = isMine(ev);
  const canAdmin = state.isAdmin && !mine;
  const past = ev.end <= new Date();
  const when = ev.allDay ? "Tutto il giorno" : `${hhmm(ev.start)} – ${hhmm(ev.end)} (${durLabel(Math.round((ev.end - ev.start) / 60000))})`;

  let actions = `<button class="btn" data-action="close">Chiudi</button>`;
  let note = "";
  if (!past && mine) {
    actions = ev.recurring && ev.seriesMasterId
      ? `<button class="btn" data-action="close">Chiudi</button>
         <button class="btn danger" data-action="cancel" data-id="${esc(ev.id)}" data-series="1">Annulla tutta la serie</button>
         <button class="btn danger" data-action="cancel" data-id="${esc(ev.id)}">Annulla solo questa</button>`
      : `<button class="btn" data-action="close">Chiudi</button>
         <button class="btn danger" data-action="cancel" data-id="${esc(ev.id)}">Annulla prenotazione</button>`;
  } else if (!past && canAdmin) {
    note = `<div class="note">Sei amministratore: puoi liberare la sala. L'organizzatore <b>non riceve avviso</b> e la riunione resta nel suo calendario: conviene avvisarlo.</div>`;
    actions = ev.recurring && ev.seriesMasterId
      ? `<button class="btn" data-action="close">Chiudi</button>
         <button class="btn danger" data-action="admindel" data-id="${esc(ev.id)}" data-series="1">Elimina serie</button>
         <button class="btn danger" data-action="admindel" data-id="${esc(ev.id)}">Elimina questa</button>`
      : `<button class="btn" data-action="close">Chiudi</button>
         <button class="btn danger" data-action="admindel" data-id="${esc(ev.id)}">Elimina (admin)</button>`;
  } else if (!past && !mine) {
    note = `<div class="note">Solo chi ha prenotato può annullare. Ti serve la sala? ${ev.organizerEmail
      ? `<a href="mailto:${esc(ev.organizerEmail)}?subject=${encodeURIComponent("Sala riunioni " + longDate(ev.start) + " " + hhmm(ev.start))}">Scrivi a ${esc(ev.organizerName)}</a>` : "Contatta l'organizzatore."}</div>`;
  }

  openModal(`
    <div class="modal-head">
      <div><h2>${esc(ev.subject)}</h2><div class="sub">${mine ? "La tua prenotazione" : "Sala occupata"}</div></div>
      <button class="xbtn" data-action="close" aria-label="Chiudi">×</button>
    </div>
    <div class="modal-body">
      <ul class="detail-list">
        <li><span class="k">Giorno</span><span>${esc(longDate(ev.start))}</span></li>
        <li><span class="k">Orario</span><span>${esc(when)}</span></li>
        <li><span class="k">Prenotato da</span><span>${esc(ev.organizerName || "—")}</span></li>
        ${ev.recurring ? `<li><span class="k">Ripetizione</span><span>Fa parte di una serie</span></li>` : ""}
      </ul>
      ${note}
    </div>
    <div class="modal-foot">${actions}</div>`);
}

async function doCancel(id, series, admin) {
  const ev = visibleEvents().find(e => e.id === id);
  if (!ev) return;
  const what = series ? "tutta la serie" : "questa prenotazione";
  if (!confirm(admin ? `Eliminare ${what} dal calendario della sala?\nL'organizzatore non verrà avvisato.` : `Annullare ${what}?`)) return;
  closeModal();
  const toHide = series && ev.seriesMasterId ? state.events.filter(e => e.seriesMasterId === ev.seriesMasterId) : [ev];
  const exp = Date.now() + 90000;
  toHide.forEach(e => state.hidden.set(e.id, exp));
  render();
  try {
    if (admin) await api.adminDelete(ev, series); else await api.cancelMine(ev, series);
    toast("ok", "Sala liberata", series ? "La serie è stata annullata." : `${ev.subject} è stata annullata.`);
  } catch (e) {
    toHide.forEach(x => state.hidden.delete(x.id));
    toast("err", "Annullamento non riuscito", friendlyError(e));
  }
  render();
  setTimeout(refresh, 4000);
}

/* ---------- toast ---------- */
function toast(kind, title, text) {
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<span>${kind === "ok" ? "✓" : kind === "err" ? "⚠" : "ℹ"}</span><span><b>${esc(title)}</b>${esc(text || "")}</span>`;
  box.appendChild(el);
  setTimeout(() => el.remove(), kind === "err" ? 8000 : 5500);
}

/* =====================================================================
   EVENTI UI
   ===================================================================== */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if (!t) return;
  const a = t.dataset.action;
  if (a === "overlay" && e.target !== t) return;
  switch (a) {
    case "login":  msalApp.loginRedirect({ scopes: SCOPES, prompt: "select_account" }); break;
    case "logout": msalApp.logoutRedirect({ account, postLogoutRedirectUri: redirectUri() }); break;
    case "prev":   state.weekStart = addDays(state.weekStart, -7); state.events = []; render(); refresh(); break;
    case "next":   state.weekStart = addDays(state.weekStart, 7);  state.events = []; render(); refresh(); break;
    case "today":
      state.weekStart = mondayOf(new Date());
      state.mobileDay = Math.min((new Date().getDay() + 6) % 7, 4);
      render(); refresh(); break;
    case "day":    state.mobileDay = +t.dataset.d; render(); break;
    case "book":   openBooking(+t.dataset.t); break;
    case "dur":    keepSubject(); form.minutes = +t.dataset.m; renderBooking(); break;
    case "detail": openDetail(t.dataset.id); break;
    case "cancel": doCancel(t.dataset.id, !!t.dataset.series, false); break;
    case "admindel": doCancel(t.dataset.id, !!t.dataset.series, true); break;
    case "close": case "overlay": closeModal(); break;
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

/* =====================================================================
   AVVIO
   ===================================================================== */
async function start() {
  if (!DEMO) {
    if (location.protocol === "file:") {
      document.getElementById("app").innerHTML = `
        <div class="login"><div class="login-card">
          <div class="lm" style="color:#fff">${ICON_CAL}</div>
          <h1>Sala Riunioni</h1>
          <p>Questo file è stato aperto dal computer.<br>L'app funziona solo dall'indirizzo ufficiale:</p>
          <a class="msbtn" style="text-decoration:none;color:var(--brand)" href="https://sstaletti-eng.github.io/Sala-Riunioni/">Apri la Sala Riunioni</a>
          <div class="small">Per vedere la demo: aggiungi <b>?demo</b> in fondo all'indirizzo.</div>
        </div></div>`;
      return;
    }
    if (typeof msal === "undefined") { renderLogin("Impossibile caricare il modulo di accesso Microsoft. Controlla la connessione e ricarica."); return; }
    msalApp = new msal.PublicClientApplication({
      auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: redirectUri() },
      cache: { cacheLocation: "localStorage" }
    });
    await msalApp.initialize();
    try {
      const resp = await msalApp.handleRedirectPromise();
      if (resp?.account) msalApp.setActiveAccount(resp.account);
    } catch (e) {
      renderLogin("Accesso non riuscito: " + (e.errorMessage || e.message));
      return;
    }
    account = msalApp.getActiveAccount() || msalApp.getAllAccounts()[0] || null;
    if (!account) { renderLogin(); return; }
    msalApp.setActiveAccount(account);
  }
  try {
    state.me = await api.me();
  } catch (e) {
    renderLogin(friendlyError(e));
    return;
  }
  const admins = CONFIG.admins.map(s => s.toLowerCase());
  state.isAdmin = DEMO || state.me.emails.some(m => admins.includes(m));
  render();
  await refresh();

  setInterval(() => { if (document.visibilityState === "visible") refresh(); }, CONFIG.refreshSeconds * 1000);
  setInterval(() => { if (!document.querySelector(".overlay")) render(); }, 60000); // linea "adesso" e slot passati
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}

start();
</script>
